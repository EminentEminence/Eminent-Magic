plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.107'
}

def canonicalVersionFile = rootProject.file('../../VERSION')
if (!canonicalVersionFile.isFile()) {
    throw new GradleException("Missing canonical version file: ${canonicalVersionFile}")
}
version = providers.gradleProperty('projectVersion').getOrElse(canonicalVersionFile.text.trim())
base.archivesName = "eminent_magic"

layout.buildDirectory.set(file("../../.build/core-workspace"))

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.8.31"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

def resourceVersion = version.toString()
tasks.named('processResources') {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(projectVersion: resourceVersion)
    }
}

apply from: 'mcreator.gradle'
